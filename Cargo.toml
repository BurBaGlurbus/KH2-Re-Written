[workspace]
members = [
    "source/main",
    "source/visual",
    "source/game/player",
    "source/game/enemy",
    "source/game/area",
    "source/game/collision",
    "source/game/event",
    "source/game/save",
    "source/game/world_map",
    "source/visual/effect",
    "source/audio",
    "source/data",
    "validation",
    "source/extras/skateboard/source",
    "source/extras/skateboard/engine/skate-disc",
    "source/extras/skateboard/engine/skate-sim",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

# Keep file/line backtraces for our code without emitting full type/variable
# information for every Bevy instantiation. Tests inherit this profile.
[profile.dev]
debug = "line-tables-only"

# Registry/git dependencies are rebuilt less often and do not need local
# debugger symbols. Keep incremental compilation for workspace edits.
[profile.dev.package."*"]
debug = 0

# Opt in when inspecting workspace locals/types in a debugger. This has its
# own output directory so ordinary development retains the compact cache.
[profile.dev-symbols]
inherits = "dev"
debug = "full"

# Full selected-source hashing is required even for development inspection.
# Optimize only this measured startup path; simulation/presentation stays on
# the ordinary development profile.
[profile.dev.package.validation]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The test room precomputes every motion frame through the checked readers at
# startup; unoptimized FK sampling made that step impractically slow.
[profile.dev.package.data]
opt-level = 3

# Music is decoded whole at startup; an unoptimized Vorbis decode of the
# title stream took about 16 s.
[profile.dev.package.lewton]
opt-level = 3

# The Skate 3 skater runs every tick of a ride; unoptimized it misses 60 Hz.
[profile.dev.package.skate-sim]
opt-level = 3

[profile.dev.package.skate-core]
opt-level = 3

[profile.dev.package.skate-data]
opt-level = 3

[profile.dev.package.skate-disc]
opt-level = 3
