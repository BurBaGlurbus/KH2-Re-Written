[workspace]
members = [
    "source/main",
    "source/visual",
    "source/game/player",
    "source/game/enemy",
    "source/game/area",
    "source/game/collision",
    "source/game/event",
    "source/game/save",
    "source/game/world_map",
    "source/visual/effect",
    "source/audio",
    "source/data",
    "validation",
    "source/extras/skateboard/source",
    "source/extras/skateboard/engine/skate-disc",
    "source/extras/skateboard/engine/skate-sim",
]
# Plain `cargo build`, `cargo test` and `cargo clippy` leave out the optional
# Skate 3 crates. Their dependencies turn on extra features in crates Bevy
# shares (profiling, downcast-rs, approx, ...), so building them beside the
# launcher compiles a second Bevy stack. `--features main/skate3` (or
# `--workspace`) brings them back.
default-members = [
    "source/main",
    "source/visual",
    "source/game/player",
    "source/game/enemy",
    "source/game/area",
    "source/game/collision",
    "source/game/event",
    "source/game/save",
    "source/game/world_map",
    "source/visual/effect",
    "source/audio",
    "source/data",
    "validation",
    "source/extras/skateboard/source",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

# A release for handing out: cross-crate thin LTO and one codegen unit let
# the optimizer inline across our crates and Bevy's. Measured on the owner's
# PC, thin LTO made a full release build 28 min and a one-file rebuild
# 10 min (2-3 min without), and the frame-rate gain could not be told apart
# from run-to-run noise, so day-to-day builds keep the plain release profile:
#   cargo build -p main --bin KH2RW --features skate3 --profile release-lto
# Panics keep unwinding: Bevy's executor reports a panicking system that
# way, and a research example catches panics.
[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 1

# Keep file/line backtraces for our code without emitting full type/variable
# information for every Bevy instantiation. Tests inherit this profile.
# Our own crates stay at opt-level 0: at 1, a one-file test rebuild took
# 264 s instead of 18 s on the owner's PC.
[profile.dev]
debug = "line-tables-only"

# Registry/git dependencies are rebuilt less often and do not need local
# debugger symbols; optimized, Bevy runs at a usable speed in development
# builds. Keep incremental compilation for workspace edits.
[profile.dev.package."*"]
debug = 0
opt-level = 3

# Opt in when inspecting workspace locals/types in a debugger. This has its
# own output directory so ordinary development retains the compact cache.
[profile.dev-symbols]
inherits = "dev"
debug = "full"

# Full selected-source hashing is required even for development inspection.
# Optimize only this measured startup path; simulation/presentation stays on
# the ordinary development profile.
[profile.dev.package.validation]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The test room precomputes every motion frame through the checked readers at
# startup; unoptimized FK sampling made that step impractically slow.
[profile.dev.package.data]
opt-level = 3

# Music is decoded whole at startup; an unoptimized Vorbis decode of the
# title stream took about 16 s.
[profile.dev.package.lewton]
opt-level = 3

# The Skate 3 skater runs every tick of a ride; unoptimized it misses 60 Hz.
[profile.dev.package.skate-sim]
opt-level = 3

[profile.dev.package.skate-core]
opt-level = 3

[profile.dev.package.skate-data]
opt-level = 3

[profile.dev.package.skate-disc]
opt-level = 3
