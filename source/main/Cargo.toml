[package]
name = "main"
default-run = "smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
visual = { path = "../visual" }
audio = { path = "../audio" }
effect = { path = "../visual/effect" }
area = { path = "../game/area" }
collision = { path = "../game/collision" }
event = { path = "../game/event" }
data = { path = "../data" }
player = { path = "../game/player" }
enemy = { path = "../game/enemy" }
save = { path = "../game/save" }
world_map = { path = "../game/world_map" }
validation = { path = "../../validation" }
skate_source = { path = "../extras/skateboard/source" }
net = { path = "../net" }
# The optional Skate 3 skateboard (GPL-3.0-only, extras/skateboard/engine); see T103.
skate-disc = { path = "../extras/skateboard/engine/skate-disc", optional = true }
skate-sim = { path = "../extras/skateboard/engine/skate-sim", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Heap allocation counts for the opt-in per-frame record (perf-diag only).
stats_alloc = { version = "=0.1.10", optional = true }
fontdue = { version = "=0.9.4", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_log", "bevy_asset", "bevy_window", "bevy_winit", "bevy_render", "bevy_camera", "bevy_image", "bevy_sprite", "bevy_sprite_render", "bevy_core_pipeline", "bevy_pbr", "bmp", "bevy_gilrs"] }

[[bin]]
name = "KH2RW"
path = "src/main.rs"

# These tools have no unit tests; the launcher (with the viewers inside it)
# keeps its own.
[[bin]]
name = "smoke"
test = false
bench = false

[[bin]]
name = "motion_eval_compare"
test = false
bench = false

[[bin]]
name = "motion_audit"
test = false
bench = false

[[bin]]
name = "limit_probe"
test = false
bench = false

[[bin]]
name = "pose_sheet"
test = false
bench = false

[[bin]]
name = "motion_ik_probe"
test = false
bench = false

[[bin]]
name = "room_scene"
test = false
bench = false

[features]
skate3 = ["dep:skate-disc", "dep:skate-sim"]
# Opt-in performance diagnostics (see `src/perf.rs`): Bevy's frame time,
# entity and memory diagnostics, and `--perf <dir>` per-frame records.
perf-diag = ["dep:stats_alloc", "bevy/sysinfo_plugin"]
# Per-system spans written as a Chrome trace (`trace-*.json` in the working
# directory, or TRACE_CHROME=<file>); `tools/trace_summary.py` totals them.
perf-trace = ["bevy/trace_chrome"]

[lints]
workspace = true
